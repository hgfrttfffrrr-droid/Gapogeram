
name: Build GAPROM APK

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      # دریافت سورس پروژه
      - name: Checkout Repository
        uses: actions/checkout@v4

      # نصب Java 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      # نصب Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      # نمایش نسخه‌ها
      - name: Check Environment
        run: |
          flutter --version
          java -version

      # اصلاح نسخه Kotlin در تنظیمات Gradle
      - name: Fix Kotlin Gradle Plugin
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          settings = Path("android/settings.gradle")
          build = Path("android/build.gradle")

          changed = False

          if settings.exists():
              content = settings.read_text()

              pattern = (
                  r"""(id\s*['"]org\.jetbrains\.kotlin\.android['"]"""
                  r"""\s+version\s*['"])[^'"]+(['"])"""
              )

              content, count = re.subn(
                  pattern,
                  r"\g<1>1.9.0\2",
                  content
              )

              if count:
                  settings.write_text(content)
                  print("Updated Kotlin in settings.gradle")
                  changed = True

          if build.exists():
              content = build.read_text()

              pattern = (
                  r"""(ext\.kotlin_version\s*=\s*['"])[^'"]+(['"])"""
              )

              content, count = re.subn(
                  pattern,
                  r"\g<1>1.9.0\2",
                  content
              )

              if count:
                  build.write_text(content)
                  print("Updated Kotlin in build.gradle")
                  changed = True

          if not changed:
              raise SystemExit(
                  "Kotlin version declaration not found. "
                  "Check android/settings.gradle and android/build.gradle"
              )
          PY

      # پاکسازی
      - name: Clean Flutter
        run: flutter clean

      # دریافت پکیج‌ها
      - name: Get Dependencies
        run: flutter pub get

      # بررسی کد Dart
      - name: Analyze Dart
        run: flutter analyze
        continue-on-error: true

      # ساخت APK نسخه Release
      - name: Build Release APK
        run: flutter build apk --release

      # بررسی فایل خروجی
      - name: Verify APK
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      # آپلود APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GAPROM-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
