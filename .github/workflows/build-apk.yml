name: Build GAPROM APK (Fixed)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      # 1. دریافت کد فعلی
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. نصب جاوا
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. نصب فلاتر
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      # 4. 🔧 ساخت پروژه تمیز با نام صحیح و کپی کردن کدها
      - name: Rebuild Project with Correct Name
        run: |
          echo "🔨 Starting clean rebuild..."
          
          # الف) ذخیره کدهای Dart و دارایی‌ها در پوشه موقت
          mkdir -p /tmp/gaprom_backup
          cp -r lib /tmp/gaprom_backup/
          cp -r assets /tmp/gaprom_backup/ 2>/dev/null || true
          cp pubspec.yaml /tmp/gaprom_backup/
          
          # ب) اصلاح نام در pubspec.yaml قبل از کپی (برای اطمینان)
          sed -i 's/^name:.*/name: gapogeram/' /tmp/gaprom_backup/pubspec.yaml
          
          # ج) حذف کل پوشه android قدیمی و خراب
          rm -rf android
          
          # د) ساخت مجدد اندروید با نام صحیح (gapogeram)
          # این کار تمام فایل‌های Gradle و Manifest را با v2 Embedding و نام کوچک می‌سازد
          flutter create --org ir.gaprom --project-name gapogeram --platforms=android .
          
          # ه) بازگرداندن کدهای Dart و دارایی‌ها
          cp -r /tmp/gaprom_backup/lib/* lib/
          if [ -d "/tmp/gaprom_backup/assets" ]; then
            cp -r /tmp/gaprom_backup/assets/* assets/
          fi
          cp /tmp/gaprom_backup/pubspec.yaml pubspec.yaml
          
          # و) اطمینان از نصب پکیج‌ها با نام جدید
          flutter pub get
          
          echo "✅ Project rebuilt successfully with name 'gapogeram'"

      # 5. بیلد نهایی
      - name: Build Release APK
        run: flutter build apk --release --split-per-abi

      # 6. آپلود خروجی
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gaprom-release-apks
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
