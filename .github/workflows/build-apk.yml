name: Build GAPROM APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      # 🔧 FIX 1: نام پکیج در pubspec.yaml باید حروف کوچک باشد
      - name: Fix pubspec package name (lowercase)
        run: |
          if grep -q '^name:[[:space:]]*Gapogeram' pubspec.yaml; then
            sed -i 's/^name:[[:space:]]*Gapogeram/name: gapogeram/' pubspec.yaml
            echo "✅ Fixed pubspec name: Gapogeram -> gapogeram"
          elif grep -q '^name:[[:space:]]*[A-Z]' pubspec.yaml; then
            CURRENT=$(grep '^name:' pubspec.yaml | awk '{print $2}')
            LOWER=$(echo "$CURRENT" | tr '[:upper:]' '[:lower:]')
            sed -i "s/^name:.*/name: $LOWER/" pubspec.yaml
            echo "✅ Fixed pubspec name: $CURRENT -> $LOWER"
          else
            echo "✅ pubspec name is already valid"
          fi
          head -3 pubspec.yaml

      - name: Get Flutter dependencies
        run: flutter pub get

      # 🔧 FIX 2: مهاجرت خودکار Android embedding به v2
      - name: Fix Android embedding v2
        run: |
          # حذف فایل‌های قدیمی اندروید اگر وجود دارند
          rm -rf android/app/src/main/java io.flutter.app.FlutterApplication 2>/dev/null || true
          
          # بازسازی ساختار اندروید با v2
          flutter create --platforms=android .
          
          # اطمینان از flutterEmbedding = 2
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            sed -i 's/android:value="1"/android:value="2"/g' android/app/src/main/AndroidManifest.xml
          fi
          
          echo "✅ Android embedding fixed to v2"

      - name: Verify project structure
        run: |
          echo "--- pubspec.yaml ---"
          head -5 pubspec.yaml
          echo ""
          echo "--- MainActivity.kt ---"
          find android -name "MainActivity.kt" -exec cat {} \;
          echo ""
          echo "--- AndroidManifest flutterEmbedding ---"
          grep -A1 "flutterEmbedding" android/app/src/main/AndroidManifest.xml || echo "Not found"

      - name: Flutter analyze
        run: flutter analyze || true

      - name: Build Release APKs (split-per-abi)
        run: flutter build apk --release --split-per-abi

      - name: Upload split APKs
        uses: actions/upload-artifact@v4
        with:
          name: gaprom-split-apks
          path: |
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          retention-days: 30

      - name: Build universal APK
        run: flutter build apk --release

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: gaprom-universal-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
