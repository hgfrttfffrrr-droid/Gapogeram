name: Build GAPROM APK (Final Fix)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      # 🔧 مرحله 1: بازسازی پروژه اندروید با نام صحیح (برای رفع مشکل Embedding)
      - name: Rebuild Android Project Structure
        run: |
          echo "🔨 Rebuilding Android structure..."
          
          # 1. بکاپ گرفتن از کدهای اصلی
          mkdir -p /tmp/gaprom_src
          cp -r lib /tmp/gaprom_src/
          cp -r assets /tmp/gaprom_src/ 2>/dev/null || true
          cp pubspec.yaml /tmp/gaprom_src/
          
          # 2. اصلاح نام پکیج در pubspec.yaml
          sed -i 's/^name:.*/name: gapogeram/' /tmp/gaprom_src/pubspec.yaml
          
          # 3. حذف اندروید قدیمی و ساخت مجدد با نام کوچک
          rm -rf android
          flutter create --org ir.gaprom --project-name gapogeram --platforms=android .
          
          # 4. بازگرداندن کدها
          cp -r /tmp/gaprom_src/lib/* lib/
          if [ -d "/tmp/gaprom_src/assets" ]; then
            cp -r /tmp/gaprom_src/assets/* assets/
          fi
          cp /tmp/gaprom_src/pubspec.yaml pubspec.yaml
          
          # 5. دریافت پکیج‌ها
          flutter pub get
          echo "✅ Android structure rebuilt."

      # 🔧 مرحله 2: آپدیت نسخه Kotlin برای سازگاری با Java 17
      - name: Update Kotlin Version in Gradle
        run: |
          echo "⚙️ Updating Kotlin version..."
          
          # پیدا کردن فایل settings.gradle یا build.gradle ریشه
          GRADLE_FILE="android/settings.gradle"
          if [ ! -f "$GRADLE_FILE" ]; then
            GRADLE_FILE="android/build.gradle"
          fi
          
          # جایگزینی نسخه قدیمی Kotlin با نسخه جدید (1.9.22)
          if grep -q "kotlin_version" "$GRADLE_FILE"; then
            sed -i "s/ext.kotlin_version = .*/ext.kotlin_version = '1.9.22'/" "$GRADLE_FILE"
            sed -i "s/kotlin_version = .*/kotlin_version = '1.9.22'/" "$GRADLE_FILE"
          else
            # اگر نبود، به build.gradle ریشه اضافه کن
            echo "ext.kotlin_version = '1.9.22'" >> android/build.gradle
          fi
          
          # اطمینان از استفاده از پلاگین جدید در settings.gradle (اگر وجود داشت)
          if [ -f "android/settings.gradle" ]; then
             sed -i "s/id 'org.jetbrains.kotlin.android' version.*/id 'org.jetbrains.kotlin.android' version '1.9.22' apply false/" android/settings.gradle 2>/dev/null || true
          fi
          
          echo "✅ Kotlin updated to 1.9.22"

      # 🔧 مرحله 3: پاکسازی کش و بیلد
      - name: Clean and Build
        run: |
          flutter clean
          flutter pub get
          flutter build apk --release --split-per-abi

      # 📦 مرحله 4: آپلود APK
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gaprom-release-apks
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
