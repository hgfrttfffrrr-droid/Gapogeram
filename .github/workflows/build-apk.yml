name: Build GAPROM APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            **/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Get Flutter dependencies
        run: flutter pub get

      # 🔧 اصلاح خودکار Android v1 -> v2 embedding
      - name: Fix Android embedding v2
        run: |
          # حذف هرگونه اشاره به v1 embedding
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            sed -i 's/android:value="1"/android:value="2"/g' android/app/src/main/AndroidManifest.xml
          fi
          
          # اطمینان از وجود flutterEmbedding v2
          if ! grep -q "flutterEmbedding" android/app/src/main/AndroidManifest.xml; then
            sed -i '/<\/application>/i \        <meta-data\n            android:name="flutterEmbedding"\n            android:value="2"/>' android/app/src/main/AndroidManifest.xml
          fi
          
          # بازسازی فایل‌های اندروید با ساختار v2
          flutter create --platforms=android .
          
          echo "✅ Android embedding v2 fixed"

      - name: Flutter analyze
        run: flutter analyze || true

      - name: Build Release APKs (split-per-abi)
        run: flutter build apk --release --split-per-abi

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gaprom-apks
          path: |
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          retention-days: 30

      - name: Build universal APK
        run: flutter build apk --release

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: gaprom-universal-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
