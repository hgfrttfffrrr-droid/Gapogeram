name: Build GAPROM APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # دکمه Run workflow دستی در گیت‌هاب

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      # 1) دریافت کد
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2) نصب Java (برای Gradle اندروید)
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3) نصب Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      # 4) کش کردن پاب‌ها (سرعت بیشتر در بیلدهای بعدی)
      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            **/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      # 5) دریافت وابستگی‌ها
      - name: Get Flutter dependencies
        run: flutter pub get

      # 6) بررسی خطاهای احتمالی (اختیاری)
      - name: Flutter analyze
        run: flutter analyze || true

      # 7) ساخت APK ریلیز (سه معماری جدا)
      - name: Build Release APKs (split-per-abi)
        run: flutter build apk --release --split-per-abi

      # 8) آپلود APKها به عنوان Artifact (قابل دانلود از صفحه Actions)
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gaprom-apks
          path: |
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          retention-days: 30

      # 9) (اختیاری) ساخت یک APK واحد برای همه معماری‌ها
      - name: Build universal APK
        run: flutter build apk --release

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: gaprom-universal-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
